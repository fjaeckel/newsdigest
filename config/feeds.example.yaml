# Copy to config/feeds.yaml and edit. That's the only file you need to touch.

# Everything time-related happens in this timezone.
timezone: Europe/Berlin

# When the digest is generated, 24h clock.
run_at: "08:00"

# How far back to look for articles. Slightly more than 24h so nothing
# published just before yesterday's run slips through the cracks.
lookback_hours: 26

# Safety rails so one chatty feed can't dominate a brief or the token bill.
# max_items_total is per category, not per run: each category is briefed on its
# own, so a loud category can't crowd a quiet one out of its feed.
max_items_per_feed: 40
max_items_total: 250

# Upper bound on topics per category, per day, for categories briefed in
# "brief" mode. Claude merges aggressively to stay under it. This is a budget
# each category gets, not one they share. A "complete" category ignores it.
max_topics: 12

# How each category is briefed. Two modes, for two different reasons to follow
# a subject:
#
#   mode: brief    — an edited selection. Merge hard, rank by importance, and
#                    drop the least important once max_topics is reached. Right
#                    for the news, where you want the gist and not the volume.
#   mode: complete — a reading list. Every article is accounted for, nothing is
#                    dropped for being minor or repetitive, and there is no
#                    topic cap. Right for a subject you follow closely and
#                    don't want edited for you. If Claude fails to mention an
#                    article, the app adds it back with the feed's own headline
#                    rather than losing it.
#
#   group_by: importance | feed — how the category's page is arranged under
#                    each day. Defaults to feed for complete (you read it
#                    outlet by outlet) and importance for brief.
#   max_topics:    — overrides the top-level budget for this category.
#
# The block is optional: a category not listed here is mode: brief.
categories:
  news:
    mode: brief
    max_topics: 15
  tech:
    mode: complete

# The front page. One extra Claude call turns the morning's finished topics
# into a handful of paragraphs in the style of The Economist's "World in
# Brief" — the few things worth knowing before anything else, drawn from every
# category rather than just the news. It is a skim, not a filter: everything it
# mentions is still waiting in its own feed underneath, so nothing is missed by
# not reading it. Set enabled: false to save the call.
brief:
  enabled: true
  max_items: 8

# Language of the brief, regardless of what language the sources are in.
language: English

# effort: low | medium | high | xhigh | max — how hard Claude thinks about it.
# One run costs one Claude call per category that has items that day, plus one
# for the front page, so the number of categories below is part of what a
# morning costs. A complete category with a very long day takes an extra call
# per 60 items, because it cannot answer a long day by dropping the tail.
model: claude-opus-5
effort: medium

exclude:
  # Free-text rules handed to Claude. Add anything you never want to read.
  topics:
    - Sports of any kind — matches, results, transfers, athletes, leagues,
      tournaments, doping, club finances, Olympics, motorsport, esports.

  # Cheap local pre-filter, applied before Claude sees anything, which saves
  # tokens. Case-insensitive substring match on title and summary.
  # Keep it conservative — Claude is the real filter, this is just the bouncer.
  keywords:
    - bundesliga
    - premier league
    - champions league
    - nfl
    - nba
    - fifa
    - uefa
    - formula 1
    - wimbledon
    - olympics
    - super bowl
    - world cup
    - transfer window
    - quarterback

# Every feed names the category it is briefed into. Each category becomes its
# own standing feed in the reader, holding unread topics until you read them.
# Categories appear on the home screen in the order they first appear here, so
# this file's order is the reader's order. A feed with no category gets
# "general".
feeds:
  - name: Tagesschau
    category: news
    url: https://www.tagesschau.de/index~rss2.xml
  - name: The Guardian — World
    category: news
    url: https://www.theguardian.com/world/rss

  - name: Heise
    category: tech
    url: https://www.heise.de/rss/heise-atom.xml
  - name: Ars Technica
    category: tech
    url: https://feeds.arstechnica.com/arstechnica/index
  - name: Hacker News
    category: tech
    url: https://hnrss.org/frontpage
